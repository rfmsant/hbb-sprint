<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12233F">
<title>HBB Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Manual de identidade HBB v1.1 — azul-porto, papel, fio de dourado, Caslon + Jost, cantos retos */
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --line:#E2DBCD; --fg:#12233F; --muted:#4A5260;
  --accent:#12233F; --accent-fg:#F4EFE6; --soft:#EDE8DF; --gold:#8C6A2F;
  --p1:#A3261B; --p2:#8C6A2F; --p3:#12233F; --p4:#4A5260; --p5:#9AA0AA;
  --late:#FBEDEA; --late-fg:#A3261B; --done:#EEF2EA;
  --serif:'Libre Caslon Text',Georgia,serif; --sans:'Jost',Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C1729; --surface:#12233F; --line:#24365A; --fg:#F4EFE6; --muted:#B9BFC9;
  --accent:#C2A061; --accent-fg:#12233F; --soft:#1B2E4F; --gold:#C2A061;
  --p1:#F29B8F; --p2:#C2A061; --p3:#F4EFE6; --p4:#B9BFC9; --p5:#7D869A;
  --late:#3A1F24; --late-fg:#F29B8F; --done:#16283F; color-scheme:dark}}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* Barra de topo */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-fg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.mono{width:34px;height:34px;display:grid;place-items:center;background:var(--accent-fg);color:var(--accent);font:700 13px var(--serif);letter-spacing:.04em;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font:400 18px/1.1 var(--serif)}
.brand small{opacity:.8;font-size:12px}
.me{border:1px solid currentColor;background:transparent;padding:5px 10px;font-size:12px;color:inherit}

/* Navegação e resumo */
.wrap{max-width:1320px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:8px 10px;text-align:left}
.kpi b{display:block;font:400 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi.warn b{color:var(--late-fg)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.search{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);padding:8px 10px}
.fbtn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;position:relative}
.fbtn .n{background:var(--gold);color:#fff;font-size:11px;padding:0 5px;margin-left:4px}

/* Estados (telemóvel: separadores) */
.stabs{display:none;gap:0;border-bottom:1px solid var(--gold);margin-bottom:10px;overflow-x:auto}
.stabs button{flex:1 0 auto;border:0;background:transparent;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.stabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--gold);font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--soft);border:1px solid var(--line);padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--gold);outline-offset:-4px}
.col h2{margin:0 2px 4px;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--p4);padding:10px 10px 8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;touch-action:pan-y}
.card[data-p=P1]{border-left-color:var(--p1)}.card[data-p=P2]{border-left-color:var(--p2)}.card[data-p=P3]{border-left-color:var(--p3)}.card[data-p=P5]{border-left-color:var(--p5)}
.card.late{background:var(--late)} .card.done{background:var(--done)} .card.done .t{text-decoration:line-through;color:var(--muted)}
.card .t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;grid-column:1}
.card .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.card .late-t{color:var(--late-fg);font-weight:600}
.card .go{grid-column:2;grid-row:1/3;align-self:center;border:1px solid var(--line);background:transparent;width:40px;height:40px;font-size:18px;color:var(--fg)}
.tag{font-size:11px;padding:1px 6px;background:var(--soft);color:var(--fg)}
.star{color:var(--gold)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:var(--surface)}

/* Lista por épico */
.ep{margin-bottom:16px}
.ep h2{font:400 18px var(--serif);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--gold);padding-bottom:4px}
.ep h2 small{font:500 12px var(--sans);color:var(--muted)}
.ep .list{display:flex;flex-direction:column;gap:6px}

/* Botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + var(--safe-b));z-index:30;background:var(--accent);color:var(--accent-fg);border:0;height:56px;padding:0 20px;font-size:16px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.15)}

/* Folha inferior (editor e filtros) */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,18,32,.45)}
.panel{background:var(--surface);width:min(620px,100%);max-height:92vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + var(--safe-b)) max(16px,env(safe-area-inset-left,0px));border-top:3px solid var(--gold)}
@media (min-width:760px){.sheet{align-items:center}.panel{border:1px solid var(--line);border-top:3px solid var(--gold)}}
.panel h3{font:400 20px var(--serif);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea,.f select{border:1px solid var(--line);background:var(--bg);padding:10px;font-size:16px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:14px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.del{color:var(--p1)}
.stamp{font-size:12px;color:var(--muted);margin-top:8px}

/* Ecrã de entrada */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.gate .box{max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate h1{font:400 26px var(--serif);margin:0}
.gate p{color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:var(--fg);color:var(--bg);padding:10px 14px;z-index:60;font-size:14px;max-width:90vw}

@media (max-width:759px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .kpi{padding:6px 8px}.kpi b{font-size:18px}.kpi span{font-size:10px}
  .stabs{display:flex}
  .board{display:block}
  .board .col{display:none;background:transparent;border:0;padding:0}
  .board .col.active{display:flex}
  .board .col h2{display:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section class="gate" id="gate">
  <div class="box">
    <div class="mono" style="width:56px;height:56px;font-size:20px">HBB</div>
    <h1>HBB Sprint</h1>
    <p id="gateMsg">Tarefas até ao go-live de 8 de março de 2027.</p>
    <button class="btn pri" id="loginBtn">Entrar com Google</button>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="mono">HBB</div>
    <div class="brand"><b>Sprint</b><small id="sub">—</small></div>
    <button class="me" id="meBtn">Sair</button>
  </header>

  <div class="wrap">
    <div class="kpis">
      <button class="kpi" data-quick="open"><b id="kOpen">0</b><span>Em aberto</span></button>
      <button class="kpi" data-quick="p1"><b id="kP1">0</b><span>P1</span></button>
      <button class="kpi warn" data-quick="late"><b id="kLate">0</b><span>Atrasadas</span></button>
      <button class="kpi" data-quick="mine"><b id="kMine">0</b><span>Minhas</span></button>
    </div>

    <div class="bar">
      <div class="seg" role="group" aria-label="Vista">
        <button data-view="board" aria-pressed="true">Quadro</button>
        <button data-view="epics" aria-pressed="false">Épicos</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Procurar…" aria-label="Procurar">
      <button class="fbtn" id="filterBtn">Filtros<span class="n" id="fCount" hidden>0</span></button>
    </div>

    <nav class="stabs" id="stabs" role="tablist" aria-label="Estado"></nav>
    <main id="view"></main>
  </div>

  <button class="fab" id="addBtn">+ Tarefa</button>
</div>

<div class="sheet" id="edSheet" hidden>
  <form class="panel" id="ed">
    <h3><span id="edH">Tarefa</span><button type="button" class="x" data-close aria-label="Fechar">×</button></h3>
    <label class="f"><span>Tarefa</span><input id="e_title" required maxlength="160" autocomplete="off"></label>
    <div class="f"><span>Estado</span><div class="chips" id="c_status"></div></div>
    <div class="f"><span>Prioridade</span><div class="chips" id="c_priority"></div></div>
    <div class="f"><span>Responsável</span><div class="chips" id="c_owner"></div></div>
    <div class="two">
      <label class="f"><span>Data limite</span><input id="e_due" type="date"></label>
      <label class="f"><span>Sprint</span><select id="e_sprint"></select></label>
    </div>
    <label class="f"><span>Épico</span><select id="e_epic"></select></label>
    <label class="f"><span>Notas</span><textarea id="e_notes" maxlength="2000"></textarea></label>
    <div class="acts">
      <button type="button" class="btn del" id="delBtn">Apagar</button>
      <div style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>
    </div>
    <p class="stamp" id="stamp"></p>
  </form>
</div>

<div class="sheet" id="fSheet" hidden>
  <div class="panel">
    <h3><span>Filtros</span><button type="button" class="x" data-close aria-label="Fechar">×</button></h3>
    <div class="f"><span>Responsável</span><div class="chips" id="f_owner"></div></div>
    <div class="f"><span>Prioridade</span><div class="chips" id="f_priority"></div></div>
    <div class="f"><span>Épico</span><div class="chips" id="f_epic"></div></div>
    <div class="f"><span>Sprint</span><div class="chips" id="f_sprint"></div></div>
    <div class="acts"><button class="btn" id="fClear">Limpar filtros</button><button class="btn pri" data-close>Ver tarefas</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDoc, addDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const GOLIVE = new Date('2027-03-08T00:00:00');
const STATUSES = [['todo','A fazer'],['doing','Em curso'],['blocked','Bloqueado'],['done','Feito']];
const NEXT = { todo:'doing', doing:'done', blocked:'doing', done:'todo' };
const OWNERS = ['Rui','Xavi','Flor','Margarida','Equipa'];
const PRIS = ['P1','P2','P3','P4','P5'];
const EPICS = ['Sociedade e legal','Marca','Tecnologia','Website','Conteúdo','Redes e lançamento','PR'];
const SPRINTS = [['S1','2026-11-23','2026-12-06'],['S2','2026-12-07','2026-12-20'],['S3','2026-12-21','2027-01-03'],['S4','2027-01-04','2027-01-17'],['S5','2027-01-18','2027-01-31'],['S6','2027-02-01','2027-02-14'],['S7','2027-02-15','2027-02-28'],['Lançamento','2027-03-01','2027-03-08'],['Depois','2027-03-09','2099-12-31']];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.toISOString().slice(0,10);
const fmt = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('pt-PT', {day:'numeric', month:'short'}) : 'sem data';
const sprintOf = t => t.sprint || (t.due ? (SPRINTS.find(([,a,b]) => t.due >= a && t.due <= b)?.[0] || 'S1') : '');
const isLate = t => t.status !== 'done' && t.due && t.due < iso(today());

let tasks = [], me = { email:'', name:'' }, view = 'board', tab = 'todo', unsub = null, editing = null;
const F = { owner:new Set(), priority:new Set(), epic:new Set(), sprint:new Set(), quick:'' };

function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

/* ---------- Sessão ---------- */
$('#loginBtn').onclick = async () => {
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await signInWithRedirect(auth, p); else $('#gateMsg').textContent = 'Não foi possível entrar: ' + e.code; }
};
$('#meBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { $('#gate').hidden = false; $('#app').hidden = true; return; }
  try {
    const m = await getDoc(doc(db, 'members', user.email));
    if (!m.exists()) { $('#gateMsg').textContent = `A conta ${user.email} ainda não tem acesso. Pede ao Rui para a adicionar.`; $('#loginBtn').textContent = 'Entrar com outra conta'; await signOut(auth); return; }
    me = { email: user.email, name: m.data().name || user.displayName || user.email };
  } catch (e) { $('#gateMsg').textContent = 'Sem acesso (' + e.code + ').'; await signOut(auth); return; }
  $('#gate').hidden = true; $('#app').hidden = false;
  $('#meBtn').textContent = me.name.split(' ')[0] + ' · Sair';
  unsub = onSnapshot(collection(db, 'tasks'), snap => {
    tasks = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, e => toast('Ligação perdida: ' + e.code));
});

/* ---------- Filtros ---------- */
function chipGroup(el, items, set, multi = true){
  el.innerHTML = items.map(v => `<button type="button" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${esc(v)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v;
    if (!multi) set.clear(); set.has(v) ? set.delete(v) : set.add(v); chipGroup(el, items, set, multi); render(); };
}
function buildFilters(){
  chipGroup($('#f_owner'), OWNERS, F.owner); chipGroup($('#f_priority'), PRIS, F.priority);
  chipGroup($('#f_epic'), EPICS, F.epic); chipGroup($('#f_sprint'), SPRINTS.map(s => s[0]), F.sprint);
}
$('#filterBtn').onclick = () => { buildFilters(); $('#fSheet').hidden = false; };
$('#fClear').onclick = () => { Object.values(F).forEach(s => s.clear?.()); F.quick = ''; buildFilters(); render(); };
document.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => { F.quick = F.quick === b.dataset.quick ? '' : b.dataset.quick; render(); });
$('#q').oninput = () => render();
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });

function filtered(){
  const q = $('#q').value.trim().toLowerCase();
  return tasks.filter(t =>
    (!F.owner.size || F.owner.has(t.owner)) && (!F.priority.size || F.priority.has(t.priority)) &&
    (!F.epic.size || F.epic.has(t.epic)) && (!F.sprint.size || F.sprint.has(sprintOf(t))) &&
    (!q || (t.title + ' ' + (t.notes || '')).toLowerCase().includes(q)) &&
    (F.quick !== 'open' || t.status !== 'done') && (F.quick !== 'p1' || (t.priority === 'P1' && t.status !== 'done')) &&
    (F.quick !== 'late' || isLate(t)) && (F.quick !== 'mine' || t.owner === me.name.split(' ')[0]));
}
const order = (a,b) => (a.priority||'P9').localeCompare(b.priority||'P9') || (a.due||'9').localeCompare(b.due||'9') || (a.title||'').localeCompare(b.title||'');

/* ---------- Desenho ---------- */
function card(t){
  const st = t.status || 'todo';
  return `<article class="card ${isLate(t)?'late':''} ${st==='done'?'done':''}" data-p="${t.priority}" data-id="${t.id}" draggable="true" tabindex="0">
    <div class="t">${t.mine ? '<span class="star">★ </span>' : ''}${esc(t.title)}</div>
    <div class="meta"><span class="tag">${esc(t.priority)}</span><span>${esc(t.owner||'—')}</span><span class="${isLate(t)?'late-t':''}">${isLate(t)?'Atrasada · ':''}${fmt(t.due)}</span><span>${esc(sprintOf(t))}</span><span>${esc(t.epic)}</span></div>
    <button class="go" data-next="${t.id}" aria-label="Avançar para ${STATUSES.find(s=>s[0]===NEXT[st])[1]}" title="Avançar para ${STATUSES.find(s=>s[0]===NEXT[st])[1]}">${st==='done'?'↺':'→'}</button>
  </article>`;
}

function render(){
  const list = filtered().sort(order);
  const open = tasks.filter(t => t.status !== 'done');
  $('#kOpen').textContent = open.length; $('#kP1').textContent = open.filter(t => t.priority === 'P1').length;
  $('#kLate').textContent = tasks.filter(isLate).length; $('#kMine').textContent = open.filter(t => t.owner === me.name.split(' ')[0]).length;
  document.querySelectorAll('[data-quick]').forEach(b => b.style.outline = F.quick === b.dataset.quick ? '2px solid var(--gold)' : '');
  const days = Math.max(0, Math.ceil((GOLIVE - today()) / 864e5));
  const cur = SPRINTS.find(([,a,b]) => iso(today()) >= a && iso(today()) <= b)?.[0] || 'antes do S1';
  $('#sub').textContent = `${days} dias até 8 mar · ${cur}`;
  const nf = F.owner.size + F.priority.size + F.epic.size + F.sprint.size; $('#fCount').hidden = !nf; $('#fCount').textContent = nf;

  const v = $('#view');
  if (!tasks.length) { v.innerHTML = `<div class="empty">Ainda não há tarefas.<br><br><button class="btn pri" id="seedBtn">Importar as 57 tarefas do backlog</button></div>`; $('#seedBtn').onclick = seed; $('#stabs').innerHTML = ''; return; }

  if (view === 'board') {
    $('#stabs').hidden = false;
    $('#stabs').innerHTML = STATUSES.map(([k,l]) => `<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l} ${list.filter(t => (t.status||'todo')===k).length}</button>`).join('');
    v.innerHTML = `<div class="board" id="board">${STATUSES.map(([k,l]) => { const c = list.filter(t => (t.status||'todo')===k);
      return `<section class="col ${tab===k?'active':''}" data-status="${k}"><h2><span>${l}</span><span>${c.length}</span></h2>${c.map(card).join('') || '<div class="empty">Nada aqui.</div>'}</section>`; }).join('')}</div>`;
  } else {
    $('#stabs').hidden = true;
    v.innerHTML = EPICS.map(ep => { const c = list.filter(t => t.epic === ep); if (!c.length) return '';
      return `<section class="ep"><h2>${esc(ep)}<small>${c.filter(t=>t.status==='done').length}/${c.length} feitas</small></h2><div class="list">${c.map(card).join('')}</div></section>`; }).join('') || '<div class="empty">Nenhuma tarefa com estes filtros.</div>';
  }
}

/* ---------- Interações ---------- */
$('#stabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; render(); } };
$('#view').addEventListener('click', e => {
  const n = e.target.closest('[data-next]'); if (n) { const t = tasks.find(x => x.id === n.dataset.next); setStatus(t, NEXT[t.status||'todo']); return; }
  const c = e.target.closest('.card'); if (c) openEditor(tasks.find(t => t.id === c.dataset.id));
});
$('#view').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) openEditor(tasks.find(t => t.id === e.target.dataset.id)); });
// arrastar entre colunas (computador)
$('#view').addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (c) e.dataTransfer.setData('text/plain', c.dataset.id); });
$('#view').addEventListener('dragover', e => { const c = e.target.closest('.col'); if (c) { e.preventDefault(); c.classList.add('over'); } });
$('#view').addEventListener('dragleave', e => e.target.closest('.col')?.classList.remove('over'));
$('#view').addEventListener('drop', e => { const c = e.target.closest('.col'); if (!c) return; e.preventDefault(); c.classList.remove('over'); setStatus(tasks.find(t => t.id === e.dataTransfer.getData('text/plain')), c.dataset.status); });
// deslizar entre estados (telemóvel)
let sx = null, sy = null;
$('#view').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
$('#view').addEventListener('touchend', e => {
  if (sx === null || view !== 'board') return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
  const i = STATUSES.findIndex(s => s[0] === tab); const j = Math.min(3, Math.max(0, i + (dx < 0 ? 1 : -1)));
  if (j !== i) { tab = STATUSES[j][0]; render(); }
});

async function setStatus(t, status){
  if (!t || t.status === status) return;
  try { await updateDoc(doc(db, 'tasks', t.id), { status, updatedAt: serverTimestamp(), updatedBy: me.name }); toast(`"${t.title.slice(0,40)}" → ${STATUSES.find(s=>s[0]===status)[1]}`); }
  catch (e) { toast('Não foi possível mudar o estado.'); }
}

/* ---------- Editor ---------- */
const E = { status:new Set(), priority:new Set(), owner:new Set() };
function single(el, items, set){ chipGroupSingle(el, items, set); }
function chipGroupSingle(el, items, set){
  el.innerHTML = items.map(([v,l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${esc(l)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; set.clear(); set.add(b.dataset.v); chipGroupSingle(el, items, set); };
}
$('#e_epic').innerHTML = EPICS.map(e => `<option>${esc(e)}</option>`).join('');
$('#e_sprint').innerHTML = '<option value="">Automático (pela data)</option>' + SPRINTS.map(s => `<option>${s[0]}</option>`).join('');

function openEditor(t){
  editing = t || null;
  $('#edH').textContent = t ? 'Editar tarefa' : 'Nova tarefa';
  $('#e_title').value = t?.title || '';
  E.status = new Set([t?.status || (view === 'board' ? tab : 'todo')]); E.priority = new Set([t?.priority || 'P2']);
  E.owner = new Set([t?.owner || me.name.split(' ')[0]]);
  single($('#c_status'), STATUSES, E.status); single($('#c_priority'), PRIS.map(p => [p,p]), E.priority);
  single($('#c_owner'), OWNERS.map(o => [o,o]), E.owner);
  $('#e_due').value = t?.due || ''; $('#e_sprint').value = t?.sprint || ''; $('#e_epic').value = t?.epic || EPICS[0]; $('#e_notes').value = t?.notes || '';
  $('#delBtn').hidden = !t; $('#delBtn').textContent = 'Apagar'; delArmed = false;
  $('#stamp').textContent = t?.updatedBy ? `Última alteração: ${t.updatedBy}` : '';
  $('#edSheet').hidden = false; if (!t) setTimeout(() => $('#e_title').focus(), 50);
}
$('#addBtn').onclick = () => openEditor(null);
$('#ed').onsubmit = async e => {
  e.preventDefault();
  const data = { title: $('#e_title').value.trim(), status: [...E.status][0], priority: [...E.priority][0], owner: [...E.owner][0],
    due: $('#e_due').value, sprint: $('#e_sprint').value, epic: $('#e_epic').value, notes: $('#e_notes').value.trim(),
    updatedAt: serverTimestamp(), updatedBy: me.name };
  if (!data.title) return;
  try {
    if (editing) await updateDoc(doc(db, 'tasks', editing.id), data);
    else await addDoc(collection(db, 'tasks'), { ...data, mine:false, createdAt: serverTimestamp(), createdBy: me.name });
    $('#edSheet').hidden = true; toast('Guardado');
  } catch (err) { toast('Não foi possível guardar.'); }
};
let delArmed = false;
$('#delBtn').onclick = async () => {
  if (!delArmed) { delArmed = true; $('#delBtn').textContent = 'Toca outra vez para apagar'; return; }
  try { await deleteDoc(doc(db, 'tasks', editing.id)); $('#edSheet').hidden = true; toast('Apagada'); } catch (e) { toast('Não foi possível apagar.'); }
};
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) s.hidden = true; }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.sheet').forEach(s => s.hidden = true); });

/* ---------- Importação inicial ---------- */
async function seed(){
  try {
    const data = await (await fetch('./seed-tasks.json')).json();
    const b = writeBatch(db);
    Object.entries(data).forEach(([id, t]) => b.set(doc(db, 'tasks', id), { ...t, updatedBy: 'Importação' }));
    await b.commit(); toast('57 tarefas importadas');
  } catch (e) { toast('Falhou a importação: ' + (e.code || e.message)); }
}
</script>
